schema_version: 2
status: draft
experiment:
  name: pilot
  purpose: validate feasibility, measurement alignment, balance, runtime, and storage
  target_runs:
    minimum: 80
    maximum: 120
  seed: 20260822

references:
  model_config: ../models/example.yaml
  domain_config: ../domains/example.yaml

decoding:
  strategy: greedy
  do_sample: false
  temperature: 0.0
  top_p: 1.0

capture:
  residual_stream: true
  attention_mode: span_aggregates
  logits: true
  layers: all
  boundaries:
    - user_to_assistant
    - first_tool_to_assistant
    - later_tool_to_assistant
  token_positions:
    - Tpre
    - Tpost
    - Tend_tool
    - Tend_assistant
  activation_mode: selected_positions_and_ipi_window
  full_sequence_subset_count: null
  ipi_window:
    left: null
    right: null
  record_token_index: true
  record_token_id: true

splitting:
  proportions:
    train: 0.6
    validation: 0.2
    test: 0.2
  connected_component_keys:
    - task_template_id
    - attack_goal_id
    - attack_style_id
    - attack_template_id
    - pair_id
    - paraphrase_family_id
    - stochastic_family_id

storage:
  artifact_root: artifacts
  activation_format: safetensors
  save_resolved_config: true
  save_environment: true
  save_checksums: true
