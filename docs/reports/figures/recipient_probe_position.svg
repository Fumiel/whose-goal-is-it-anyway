<rect x="766" y="72" width="28" height="34" rx="4" fill="#2a78d6"/>
<text x="30" y="126" font-size="12" fill="#52514e">指示文　→　ファイルの読み取り　→　読み取った結果（口座番号を含む）　→　「ここから応答を始める」</text>
<text x="780.0" y="144" font-size="12" font-weight="600" text-anchor="end" fill="#0b0b0b">取得位置：応答を始める直前の最後のトークン</text>
<line x1="780.0" y1="108" x2="780.0" y2="114" stroke="#2a78d6" stroke-width="2"/>
<rect x="30" y="190" width="250" height="92" rx="8" fill="#f1f0ec" stroke="#e4e3df" stroke-width="1.5"/>
<text x="44" y="214" font-size="13" font-weight="600" fill="#0b0b0b">内部状態（第8層）</text>
<text x="44" y="234" font-size="12" fill="#52514e">モデルが計算途中に持つ</text>
<text x="44" y="252" font-size="12" fill="#52514e">4,096個の数値の列</text>
<text x="44" y="270" font-size="12" fill="#52514e">（その位置の1つ分だけを保存）</text>
<rect x="330" y="190" width="230" height="92" rx="8" fill="#f1f0ec" stroke="#e4e3df" stroke-width="1.5"/>
<text x="344" y="214" font-size="13" font-weight="600" fill="#0b0b0b">プローブ（線形判定器）</text>
<text x="344" y="234" font-size="12" fill="#52514e">学習用の条件で、数値列から</text>
<text x="344" y="252" font-size="12" fill="#52514e">「この口座は送金先か」を</text>
<text x="344" y="270" font-size="12" fill="#52514e">口座ごとに判定するよう学習</text>
<rect x="610" y="190" width="220" height="92" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="624" y="214" font-size="13" font-weight="600" fill="#0b0b0b">出力：口座ごとのスコア</text>
<text x="624" y="234" font-size="12" fill="#52514e">4つの候補口座それぞれの</text>
<text x="624" y="252" font-size="12" fill="#52514e">「送金先らしさ」</text>
<text x="624" y="270" font-size="12" fill="#52514e">→ 本物の送金先が高いか評価</text>
<line x1="280" y1="236.0" x2="326" y2="236.0" stroke="#52514e" stroke-width="2"/>
<line x1="326" y1="236.0" x2="319.0" y2="232.2" stroke="#52514e" stroke-width="2"/>
<line x1="326" y1="236.0" x2="319.0" y2="239.8" stroke="#52514e" stroke-width="2"/>
<line x1="560" y1="236.0" x2="606" y2="236.0" stroke="#52514e" stroke-width="2"/>
<line x1="606" y1="236.0" x2="599.0" y2="232.2" stroke="#52514e" stroke-width="2"/>
<line x1="606" y1="236.0" x2="599.0" y2="239.8" stroke="#52514e" stroke-width="2"/>
<path d="M 780.0 150 L 780.0 160 L 155 160 L 155 187" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="155,188 150,180 160,180" fill="#2a78d6"/>
<text x="30" y="312" font-size="13" font-weight="600" fill="#0b0b0b">入力の作り方は2通り</text>
<rect x="30" y="324" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="48" y="334" font-size="12" fill="#0b0b0b">統制した履歴（学習・評価に使用）：こちらが会話履歴を決めてモデルに入力する。672条件すべて。</text>
<rect x="30" y="346" width="10" height="10" rx="2" fill="#eb6834"/>
<text x="48" y="356" font-size="12" fill="#0b0b0b">自由実行（一貫性の確認に使用）：モデル自身にツールを呼ばせ、その途中の同じ位置を取得する。112条件。</text>
</svg>
