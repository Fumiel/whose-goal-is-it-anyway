<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans CJK JP', 'Yu Gothic', Meiryo, sans-serif" role="img" aria-labelledby="t d"><title id="t">内部状態を取得する位置</title><desc id="d">会話履歴をトークンに分割した列のうち、応答を始める直前の最後のトークンで、第8層の内部状態（4096個の数値）を取得し、口座ごとのプローブで採点する流れ。</desc>
<rect width="860" height="400" fill="#fcfcfb"/>
<text x="30" y="30" font-size="16" font-weight="600" fill="#0b0b0b">内部状態を取り出す位置と、プローブの使い方</text>
<text x="30" y="56" font-size="13" font-weight="600" fill="#0b0b0b">① モデルへの入力：会話履歴を小さな単位（トークン）に分割した列（約1,800個）</text>
<rect x="30" y="72" width="28" height="34" rx="4" fill="#e4e3df"/>
